<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Something went wrong — ResumeMatch AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f9f8f6;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e0db;
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .emoji { font-size: 2.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: #6b6b6b; margin-bottom: 1.5rem; line-height: 1.6; }
    .message {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      margin-bottom: 1.5rem;
      text-align: left;
    }
    a {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 24px;
      border-radius: 8px;
      text-decoration: none;
    }
    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">⚠️</div>
    <h1>Something went wrong</h1>
    <p>We hit an issue processing your request. Your payment has not been charged.</p>
    {% if message %}
    <div class="message">{{ message }}</div>
    {% endif %}
    <a href="/">Try again →</a>
  </div>
</body>
</html>
